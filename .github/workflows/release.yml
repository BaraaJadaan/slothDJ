name: Release

# Push a tag like v1.2.0 to build installers for every platform and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Package the browser extension
        run: cd extension && zip -r "../SlothDJ-extension-${GITHUB_REF_NAME}.zip" . -x '.*'

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Take the id from the create call itself; listing releases right after
          # creating one can miss a brand-new draft.
          id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="SlothDJ ${GITHUB_REF_NAME}" \
            -F draft=true -F body=@.github/release-notes.md --jq .id)
          test -n "$id" || { echo "::error::Release creation returned no id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          zip="SlothDJ-extension-${GITHUB_REF_NAME}.zip"
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/zip" \
            --data-binary @"$zip" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$id/assets?name=$zip" > /dev/null

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'app/src-tauri -> target'

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed copies can verify updates (see tauri.conf.json → plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # Release builds also produce signed update files and latest.json for the in-app updater.
          args: ${{ matrix.args }} --config app/src-tauri/tauri.release.conf.json
          includeUpdaterJson: true

      - name: Attach the portable Windows exe
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="SlothDJ_${GITHUB_REF_NAME#v}_x64_portable.exe"
          cp app/src-tauri/target/release/slothdj.exe "$name"
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$name" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${{ needs.create-release.outputs.id }}/assets?name=$name" > /dev/null

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ needs.create-release.outputs.id }}" -F draft=false
