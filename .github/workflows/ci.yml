name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'app/src-tauri -> target'

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Unit tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml -- -D warnings

      - name: Check extension and UI scripts parse
        run: for f in extension/*.js app/ui/app.js; do node --check "$f"; done
