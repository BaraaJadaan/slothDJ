<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BE8D60"/>
      <stop offset="1" stop-color="#92643D"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF0DC"/>
      <stop offset="1" stop-color="#EBD6B4"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1F45"/>
      <stop offset="1" stop-color="#160F28"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- sound waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".35">
    <path d="M44 252 q-14 48 0 96" stroke-width="10"/>
    <path d="M468 252 q14 48 0 96" stroke-width="10"/>
  </g>

  <!-- soft shadow under head -->
  <ellipse cx="256" cy="430" rx="128" ry="22" fill="#2A0F4F" opacity=".25"/>

  <!-- head -->
  <ellipse cx="256" cy="292" rx="146" ry="134" fill="url(#fur)"/>
  <!-- fur tuft -->
  <path d="M206 170 C 214 146 238 144 250 160 C 260 140 290 142 300 166 C 270 156 236 158 206 170 Z" fill="#92643D"/>

  <!-- face mask -->
  <path d="M256 200 C 336 200 366 252 366 302 C 366 362 314 396 256 396 C 198 396 146 362 146 302 C 146 252 176 200 256 200 Z" fill="url(#mask)"/>

  <!-- eye patches (droopy, the sloth signature) -->
  <ellipse cx="200" cy="294" rx="50" ry="27" transform="rotate(-24 200 294)" fill="#5A3B26"/>
  <ellipse cx="312" cy="294" rx="50" ry="27" transform="rotate(24 312 294)" fill="#5A3B26"/>

  <!-- eyes -->
  <circle cx="215" cy="286" r="14" fill="#120B1A"/>
  <circle cx="297" cy="286" r="14" fill="#120B1A"/>
  <circle cx="220" cy="281" r="5" fill="#ffffff"/>
  <circle cx="302" cy="281" r="5" fill="#ffffff"/>

  <!-- nose + smile -->
  <ellipse cx="256" cy="328" rx="23" ry="15" fill="#3A2618"/>
  <ellipse cx="249" cy="323" rx="7" ry="4" fill="#ffffff" opacity=".35"/>
  <path d="M230 354 Q 256 378 282 354" fill="none" stroke="#3A2618" stroke-width="8" stroke-linecap="round"/>

  <!-- headphones -->
  <path d="M100 304 C 100 104 412 104 412 304" fill="none" stroke="url(#band)" stroke-width="30" stroke-linecap="round"/>
  <path d="M100 304 C 100 104 412 104 412 304" transform="translate(0 -8)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 70 150 1000" opacity=".22"/>
  <rect x="66" y="242" width="70" height="120" rx="33" fill="url(#band)"/>
  <rect x="376" y="242" width="70" height="120" rx="33" fill="url(#band)"/>
  <rect x="80" y="260" width="30" height="84" rx="15" fill="url(#cup)"/>
  <rect x="402" y="260" width="30" height="84" rx="15" fill="url(#cup)"/>
</svg>
